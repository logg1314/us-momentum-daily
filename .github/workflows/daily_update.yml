name: Daily Momentum & Futures War Room V3.0

on:
  schedule:
    # 美股收市後每日自動更新（香港時間星期二至六 06:25 HKT，確保 qm-screener-auto 已先跑完）
    - cron: "25 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yfinance for Futures & Seasonality
        run: pip install --quiet yfinance

      - name: Build V3.0 Equities, Futures/COT & QM Screener Data
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_BRIDGE_URL: ${{ secrets.DRIVE_BRIDGE_URL }}
          SCREENER_REPO_TOKEN: ${{ secrets.SCREENER_REPO_TOKEN }}
          SCREENER_REPO: "logg1314/qm-screener-auto"
        run: python update_report.py

      - name: Commit updated V3.0 data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: auto update V3.0 equities, futures COT & QM screener"
          git push
