name: Daily Momentum & Futures War Room V4.0

on:
  repository_dispatch:
    types: [screener_completed]
  schedule:
    - cron: "55 22 * * 1-5" # 後備排程：HKT 06:55（星期二至六）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-war-room-update
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: Run V4.0 War Room update script
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_BRIDGE_URL: ${{ secrets.DRIVE_BRIDGE_URL }}
          SCREENER_REPO_TOKEN: ${{ secrets.SCREENER_REPO_TOKEN }}
          SCREENER_REPO: logg1314/qm-screener-auto
        run: python update_report.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-update War Room V4.0 data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
