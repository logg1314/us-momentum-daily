name: Daily Massive Momentum Update

on:
  schedule:
    # 美股收市後每日自動更新（香港時間星期二至六 06:15 HKT）
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Massive API data and update index.html
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_report.py

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: auto update daily momentum report"
          git push
